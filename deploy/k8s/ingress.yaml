apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signal-layer-frontend
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [trade.example.com, workspace.example.com]
      secretName: signal-layer-tls
  rules:
    - host: trade.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signal-layer-frontend-public
                port: { number: 80 }
    - host: workspace.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signal-layer-frontend-private
                port: { number: 80 }
