# ============================================================================
# SignalLayer 边缘 nginx：两个域名，一套后端
# ============================================================================
#
#   caopan.me        → /usr/share/nginx/public   （公开站，匿名可看指标）
#   work.caopan.me   → /usr/share/nginx/private  （私有站，登录后完整工作区）
#   两个域名的 /api/ 与 /ws 都反代到 backend:8000，所以前端产物里用的是同源相对
#   地址（VITE_API_BASE=/api/v1），没有跨域、也没有写死域名。
#
# 换域名只需要改下面 3 个 server_name、ssl_certificate 路径和 api-proxy 无关的注释。
#
# ⚠️ 中国大陆地域的 ECS：域名解析到境内公网 IP 后，80/443 必须完成 ICP 备案才会
#    放行，否则只有域名+端口是通的。未备案时请先看 README「没有备案怎么办」。
# ============================================================================

# WebSocket 升级所需的连接头映射（http 上下文：conf.d/*.conf 被 include 在 http 内）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 公开站接口是匿名可用的，按来源 IP 限流，避免被当成免费行情接口刷。
# 限流只加在公开站（见下方 public 的 /api/），私有站登录用户不限制。
# 若以后在前面套了 CDN，$binary_remote_addr 会变成 CDN 的 IP，
# 需要改成按 $http_x_forwarded_for 限流。
limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;

upstream signal_backend {
    server backend:8000;
    keepalive 32;
}

# 兜底：不认识的域名（含直接访问 IP）直接断开，不给任何内容
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 容器健康检查用：curl http://127.0.0.1/healthz
    location = /healthz {
        default_type text/plain;
        return 200 'ok\n';
    }

    return 444;
}

# ── 公开站：HTTP 只用于 ACME 校验与跳转 ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name caopan.me;

    # certbot 续期走这里（webroot 与 certbot 容器共享 acme 卷）
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 私有站：同上 ──────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name work.caopan.me;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 公开站 HTTPS ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name caopan.me;

    # 证书目录名取首次签发时的第一个 -d 域名；换 --cert-name 时这里也要跟着改
    ssl_certificate     /etc/letsencrypt/live/caopan.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caopan.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 确认两个域名都能正常打开后再取消下面这行的注释（HSTS 生效后浏览器会强制 https）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;
    root /usr/share/nginx/public;
    index index.html;

    location /api/ {
        limit_req zone=public_api burst=30 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_pass http://signal_backend;
    }

    location /ws {
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_pass http://signal_backend;
        # 长连接：别让 nginx 到点把 WebSocket 掐掉
        proxy_read_timeout 3600s;
    }

    # 构建产物文件名带内容哈希，可以长缓存
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # index.html 必须每次回源校验，否则改版后浏览器会拿旧 index 去请求已删除的资源
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}

# ── 私有站 HTTPS ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name work.caopan.me;

    ssl_certificate     /etc/letsencrypt/live/caopan.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caopan.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;
    root /usr/share/nginx/private;
    index index.html;

    # 这里刻意不加限流：私有站是登录后的研究操作（回测、选股扫描）会连续打接口。
    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_pass http://signal_backend;
    }

    location /ws {
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_pass http://signal_backend;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
