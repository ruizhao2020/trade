# ============================================================================
# 反向代理：/api 与 /ws → 后端容器
# ============================================================================
#
# 被 edge.conf 的两个 server 块 include，保证公开站与私有站走同一套规则。

# 后端接口偶尔会很慢（akshare 拉数据、回测逐根计算），前端请求超时是 180s
# （src/api/client.ts 的 DEFAULT_TIMEOUT_MS）。nginx 默认 60s 会先返回 504，
# 前端看到的是"服务不可用"，很容易误判成后端挂了——所以这里必须大于 180s。
proxy_read_timeout 240s;
proxy_send_timeout 240s;
proxy_connect_timeout 10s;

# 不缓存：行情与回测结果都由后端自己按 cache_ttl 管，nginx 再缓存会掩盖刷新按钮
proxy_buffering off;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# 前端每个请求都带这个头（src/api/client.ts），后端按它区分公开/私有入口
proxy_set_header X-Signal-Surface $http_x_signal_surface;
# WebSocket 升级（/ws?token=...）：后端用 query 里的 token 鉴权，
# 因为浏览器的 WebSocket API 不能自定义 Authorization 头。
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
