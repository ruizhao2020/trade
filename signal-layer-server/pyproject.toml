[tool.poetry]
name = "signal-layer-server"
version = "0.1.0"
description = "Multi-timeframe K-line trading signal backend"
authors = ["SignalLayer"]
readme = "README.md"
python = "^3.12"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
aiomysql = "^0.2"
alembic = "^1.14"
redis = {extras = ["hiredis"], version = "^5.2"}
pydantic = "^2.10"
pydantic-settings = "^2.0"
python-dotenv = "^1.0"
akshare = "^1.16"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
httpx = "^0.28"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
