name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-layer-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # 只装测试真正需要的包：测试从不 import akshare（适配器里是 try/except 兜底），
      # 装它会拖进 pandas 等重依赖，明显拖慢 CI。生产依赖仍以 pyproject 为准。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" "sqlalchemy[asyncio]" aiomysql redis \
            pydantic pydantic-settings python-dotenv alembic \
            pytest pytest-asyncio httpx aiosqlite
      - name: 运行测试
        run: python -m pytest -q

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-layer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: signal-layer/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npx tsc -b --noEmit
      - name: Lint
        run: npm run lint
      - name: 单元测试
        run: npm test
      # 两个入口都要能构建：public/private 共用一份代码、按 mode 切换
      - name: 构建（public）
        run: npm run build:public
      - name: 构建（private）
        run: npm run build:private
